<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 108 108">
  <!-- Signal scan arc (seek) -->
  <path d="M32 38 C44 30, 60 30, 70 40 C80 50, 80 64, 70 72"
        fill="none" stroke="#4D6BFE" stroke-width="7" stroke-linecap="round"/>

  <!-- Inner flow stream (flow) -->
  <path d="M32 46 C42 38, 54 38, 62 46 C70 54, 70 64, 62 70"
        fill="none" stroke="#4D6BFE" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- Focal origin node -->
  <circle cx="32" cy="38" r="4.5" fill="#4D6BFE"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- White background -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="#ffffff" stroke="#E8E8F0" stroke-width="4"/>

  <!-- Primary signal sweep (seek) -->
  <path d="M128 196 C178 140, 260 136, 320 172 C380 208, 400 276, 364 324"
        fill="none" stroke="#4D6BFE" stroke-width="40" stroke-linecap="round"/>

  <!-- Secondary flow line (inner track) -->
  <path d="M128 256 C168 208, 236 200, 284 232 C332 264, 352 312, 324 352"
        fill="none" stroke="#4D6BFE" stroke-width="24" stroke-linecap="round" opacity="0.55"/>

  <!-- Tertiary accent flow -->
  <path d="M128 304 C160 264, 216 256, 252 280 C288 304, 304 340, 284 368"
        fill="none" stroke="#4D6BFE" stroke-width="14" stroke-linecap="round" opacity="0.3"/>

  <!-- Scan origin node -->
  <circle cx="128" cy="196" r="20" fill="#4D6BFE"/>
  <circle cx="128" cy="196" r="8" fill="#ffffff"/>
</svg>
